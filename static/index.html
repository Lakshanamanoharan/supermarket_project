<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supermarket Live Assistant Dashboard</title>
    <!-- Modern Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc; /* Soft slate-50 */
            color: #0f172a;
        }
        .card-panel {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-panel:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
        }
        .item-row {
            transition: background-color 0.2s ease;
        }
        .item-row:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="p-4 md:p-10 min-h-screen">

    <div class="max-w-6xl mx-auto space-y-8">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-8 rounded-[24px] shadow-sm border border-slate-200">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-800 tracking-tight">
                    Live Call Dashboard
                </h1>
                <p class="text-slate-500 mt-2 font-medium">Monitoring active AI conversations in real-time</p>
            </div>
            <div class="flex items-center space-x-3 mt-4 md:mt-0 bg-emerald-50 px-5 py-2.5 rounded-full border border-emerald-100">
                <span class="flex h-3 w-3 relative shadow-emerald-200">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </span>
                <span class="text-emerald-700 font-bold tracking-wide text-sm">System Online</span>
            </div>
        </header>

        <!-- Live Orders Container -->
        <div id="orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Cards injected via JS -->
        </div>
    </div>

    <script>
        function exportToCSV(orderId, cart, finalizedInfo) {
            let csvContent = "data:text/csv;charset=utf-8,";
            csvContent += "Order ID,Product,Quantity,Price,Total\n";
            
            let grandTotal = 0;
            cart.forEach(item => {
                const total = item.quantity * item.price;
                grandTotal += total;
                csvContent += `${orderId},${item.product},${item.quantity},₹${item.price},₹${total}\n`;
            });
            
            csvContent += `\n,,GRAND TOTAL,,₹${grandTotal}\n`;
            
            if (finalizedInfo) {
                csvContent += `\nDelivery Mode: ${finalizedInfo.delivery_mode}\n`;
                if (finalizedInfo.delivery_address) {
                    csvContent += `Address: ${finalizedInfo.delivery_address.replace(/,/g, " ")}\n`;
                }
            }

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `order_${orderId}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function fetchLiveCarts() {
            try {
                const response = await fetch('/api/live-carts');
                const data = await response.json();
                renderDashboard(data.calls);
            } catch (err) {
                console.error("Failed to fetch dashboard data:", err);
            }
        }

        function renderDashboard(calls) {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';

            if (calls.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-20 bg-white rounded-[24px] border border-slate-200 shadow-sm">
                        <svg class="mx-auto h-16 w-16 mb-6 text-slate-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                        </svg>
                        <h3 class="text-2xl font-bold text-slate-800">No active calls</h3>
                        <p class="text-slate-500 mt-2 font-medium">Waiting for customers to call in...</p>
                    </div>`;
                return;
            }

            calls.forEach(call => {
                const { call_sid, caller_number, status, cart, finalized } = call;
                let grandTotal = 0;
                
                const card = document.createElement('div');
                card.className = "card-panel p-6 flex flex-col justify-between";
                
                let badge = "";
                if (status === "finalized" || finalized) {
                    badge = `<span class="bg-blue-100 text-blue-700 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wide">Finalized</span>`;
                } else if (status === "ended") {
                    badge = `<span class="bg-slate-200 text-slate-600 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wide">Call Ended</span>`;
                } else {
                    badge = `<span class="bg-amber-100 text-amber-700 text-xs px-3 py-1 rounded-full font-bold uppercase tracking-wide animate-pulse">In Progress</span>`;
                }

                let contentHTML = `
                    <div>
                        <div class="flex justify-between items-start mb-6">
                            <div>
                                <h2 class="text-xl font-extrabold text-slate-800 mb-1">${caller_number}</h2>
                                <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">ID: ${call_sid.substring(0, 10)}...</p>
                            </div>
                            ${badge}
                        </div>
                        
                        <div class="space-y-3 mt-2 border-t border-slate-100 pt-5">
                            ${cart.length === 0 ? `
                                <div class="py-8 text-center bg-slate-50 rounded-xl border border-slate-100 border-dashed">
                                    <p class="text-slate-500 text-sm font-semibold mb-1">Cart is empty</p>
                                    <p class="text-slate-400 text-xs font-medium">${status === 'ended' ? 'No items ordered' : 'Listening to customer...'}</p>
                                </div>` : ''}
                                
                            ${cart.map(item => {
                                const itemTotal = item.quantity * item.price;
                                grandTotal += itemTotal;
                                return `
                                <div class="item-row flex justify-between items-center p-3.5 rounded-xl bg-slate-50 border border-slate-100 shadow-sm">
                                    <div>
                                        <p class="text-sm font-bold text-slate-800 capitalize">${item.product}</p>
                                        <p class="text-[13px] font-semibold text-slate-500 mt-1">${item.quantity} unit(s) × ₹${item.price}</p>
                                    </div>
                                    <div class="text-base font-extrabold text-slate-800">₹${itemTotal}</div>
                                </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;

                contentHTML += `
                    <div class="mt-8 pt-5 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-6">
                            <span class="text-slate-500 font-bold uppercase text-xs tracking-wider">Grand Total</span>
                            <span class="text-3xl font-extrabold text-slate-800">₹${grandTotal}</span>
                        </div>
                        <button onclick='exportToCSV("${call_sid}", ${JSON.stringify(cart)}, ${JSON.stringify(finalized)})' 
                                class="w-full flex items-center justify-center space-x-2 bg-indigo-600 hover:bg-indigo-700 focus:ring-4 focus:ring-indigo-100 text-white font-bold py-3.5 px-4 rounded-xl transition-all shadow-md">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                            <span>Download Receipt</span>
                        </button>
                    </div>
                `;
                
                card.innerHTML = contentHTML;
                container.appendChild(card);
            });
        }

        // Poll every 700ms for instant updates
        setInterval(fetchLiveCarts, 700);
        fetchLiveCarts();
    </script>
</body>
</html>
